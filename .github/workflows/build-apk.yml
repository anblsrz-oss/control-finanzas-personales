name: Build Android APK

# Compila, firma y publica el APK en la nube (GitHub lo hace todo; tu equipo no
# necesita Android Studio ni el SDK).
#
# Disparadores:
#  - Empujar una etiqueta vX.Y.Z  -> compila, firma y publica un Release con
#    finzen.apk (nombre fijo, para releases/latest/download),
#    finzen-vX.Y.Z.apk (nombre con versión, para saber qué APK tienes bajado) y
#    finzen-play-vX.Y.Z.aab (para subir a Google Play Console)
#  - Ejecutar manualmente (Actions -> Build Android APK -> Run workflow)
#    -> compila y firma; el APK queda como "artifact" descargable del run
#
# Requiere 7 secrets del repo (Settings -> Secrets and variables -> Actions):
#  ANDROID_KEYSTORE_BASE64      keystore en base64
#  ANDROID_KEYSTORE_PASSWORD    contraseña del keystore
#  ANDROID_KEY_ALIAS            alias de la llave
#  ANDROID_KEY_PASSWORD         contraseña de la llave
#  VITE_SUPABASE_URL            URL del proyecto Supabase (Project Settings -> API)
#  VITE_SUPABASE_ANON_KEY       clave anon/publishable (Project Settings -> API)
#  GOOGLE_SERVICES_JSON_BASE64  android/app/google-services.json en base64 (push/FCM)
# (ver APK_BUILD.md para generarlos)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    # Dos variantes con la misma llave y el mismo versionCode (ver
    # android/app/build.gradle, productFlavors):
    #  - github: APK para el Release de GitHub (con captura de SMS).
    #  - play:   AAB para subir a Google Play Console (sin SMS, sin compra
    #            con Stripe, sin aviso de actualización por APK).
    strategy:
      fail-fast: false
      matrix:
        include:
          - flavor: github
            distribution: ''
            gradle_task: assembleGithubRelease
            output_dir: android/app/build/outputs/apk/github/release
          - flavor: play
            distribution: play
            gradle_task: bundlePlayRelease
            output_dir: android/app/build/outputs/bundle/playRelease
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        # Google retiró el paquete legado "tools" del índice del SDK; el
        # default de esta action ("tools platform-tools") ya no resuelve y
        # tira "Failed to find package 'tools'" con exit code 1. Gradle no
        # lo necesita (usa platform-tools + build-tools + la plataforma vía
        # el runner de Android Studio ya preinstalado), así que basta con
        # platform-tools.
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install dependencies
        run: npm ci

      # Sin este archivo el plugin google-services no se aplica (build.gradle
      # lo detecta y sigue sin fallar), y el APK queda sin push funcional.
      - name: Write google-services.json
        run: echo "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" | base64 -d > android/app/google-services.json

      - name: Build web assets
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_DISTRIBUTION: ${{ matrix.distribution }}

      - name: Capacitor sync (Android)
        run: npx cap sync android

      # Cada build necesita una versión distinta y creciente para que Android
      # (y el aviso de actualización) reconozcan un APK como más nuevo que el
      # anterior. versionCode = número de ejecución (siempre sube);
      # versionName = el tag sin la 'v' (vacío en ejecuciones manuales).
      - name: Set Android version
        run: |
          VERSION_NAME="${GITHUB_REF_NAME#v}"
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then VERSION_NAME="0.0.0-dev.${GITHUB_RUN_NUMBER}"; fi
          sed -i "s/versionCode 1/versionCode ${GITHUB_RUN_NUMBER}/" android/app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"${VERSION_NAME}\"/" android/app/build.gradle
          echo "versionCode=${GITHUB_RUN_NUMBER} versionName=${VERSION_NAME}"
          # Disponible para los pasos siguientes (nombre del APK, Release).
          echo "VERSION_NAME=${VERSION_NAME}" >> "$GITHUB_ENV"

      - name: Build unsigned release (${{ matrix.flavor }})
        run: |
          cd android
          chmod +x gradlew
          ./gradlew ${{ matrix.gradle_task }} --no-daemon

      # r0adkll/sign-android-release solo tiene v1 (aún en Node 20 y usa
      # ::set-output::). No hay reemplazo directo; GitHub lo fuerza a Node 24.
      # Firma tanto .apk (zipalign + apksigner) como .aab (jarsigner).
      - name: Sign ${{ matrix.flavor }}
        id: sign
        uses: r0adkll/sign-android-release@v1
        with:
          releaseDirectory: ${{ matrix.output_dir }}
          signingKeyBase64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          alias: ${{ secrets.ANDROID_KEY_ALIAS }}
          keyStorePassword: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.ANDROID_KEY_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: '34.0.0'

      # Dos copias del mismo APK firmado:
      #  - finzen.apk           nombre fijo -> releases/latest/download/finzen.apk
      #  - finzen-vX.Y.Z.apk    nombre con versión -> se ve en el archivo bajado
      - name: Name APK files
        if: matrix.flavor == 'github'
        run: |
          SIGNED="${{ steps.sign.outputs.signedReleaseFile }}"
          cp "$SIGNED" finzen.apk
          cp "$SIGNED" "finzen-v${VERSION_NAME}.apk"

      # El AAB se sube a mano en Play Console (Prueba interna / cerrada /
      # Producción). finzen-play-vX.Y.Z.aab
      - name: Name AAB file
        if: matrix.flavor == 'play'
        run: cp "${{ steps.sign.outputs.signedReleaseFile }}" "finzen-play-v${VERSION_NAME}.aab"

      # Descargable desde el run (útil para ejecuciones manuales).
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: finzen-${{ matrix.flavor }}
          path: |
            finzen*.apk
            finzen-play-*.aab

      # Solo al empujar una etiqueta: publica el Release con ambos APKs
      # (finzen.apk y finzen-vX.Y.Z.apk) y el AAB de Play. Cada variante de la
      # matriz agrega sus archivos al mismo Release.
      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            finzen*.apk
            finzen-play-*.aab
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
